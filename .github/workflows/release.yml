name: Build and release

# Push a tag like v0.2.0 to build the library and the Mac and Windows apps and publish a GitHub release.
# Run it by hand (Actions > Build and release > Run workflow) to build without releasing.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      accept_library_changes:
        description: "Publish the library even if the check finds documents missing or much smaller (only after checking the changes are genuine)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"   # Mondays: rebuild the library so new editions of the documents are picked up

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pypdf
      - run: python tests/test_app.py
      - run: python tests/test_check.py

  library:
    needs: test
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pypdf pillow
      - run: python library/build.py --release
      - name: Check against the published library
        # Stops a broken library (a document missing, or much smaller than last time) reaching installed apps.
        # The failed run emails you; the report is on the run's summary page.
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT: ${{ inputs.accept_library_changes && '--accept' || '' }}
        run: |
          mkdir -p previous
          if gh release download --repo "$GITHUB_REPOSITORY" -p regs.sqlite.gz -D previous; then
            gunzip previous/regs.sqlite.gz
          else
            echo "No published library yet: checking the new one on its own."
          fi
          python library/check.py library/dist/regs.sqlite previous/regs.sqlite --report "$GITHUB_STEP_SUMMARY" $ACCEPT
      - uses: actions/upload-artifact@v4
        with:
          name: library
          path: |
            library/dist/regs.sqlite
            library/dist/regs.sqlite.gz
            library/dist/library.json

  app:
    needs: library
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon (macos-14 runners are scarce; jobs were cancelled waiting)
            zip: Para-mac.zip
            webview: pywebview
          - os: windows-latest
            zip: Para-windows.zip
            webview: pywebview
          - os: ubuntu-22.04      # oldest glibc we support: the build runs on Ubuntu 22.04+, Debian 12+, Fedora 36+
            zip: Para-linux.tar.gz
            webview: "pywebview[qt]"   # Qt is bundled: GTK/WebKit differ between distributions
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: library, path: library/dist }
      - name: X libraries to bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxkbcommon-x11-0 libegl1
      - run: pip install pyinstaller "${{ matrix.webview }}" pypdf truststore
      - run: pyinstaller --noconfirm --clean packaging/app.spec
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "Para.app" "../${{ matrix.zip }}"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Para" -DestinationPath "${{ matrix.zip }}"
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux/install.sh dist/Para/
          tar -czf "${{ matrix.zip }}" -C dist Para
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.zip }}", path: "${{ matrix.zip }}" }

  release:
    needs: [library, app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cp para/models.json out/models.json && ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Para-mac.zip
            out/Para-windows.zip
            out/Para-linux.tar.gz
            out/regs.sqlite.gz
            out/library.json
            out/models.json
          generate_release_notes: true

  library-update:
    # Weekly: publish a fresh library to the latest release, so installed apps offer it as an update.
    needs: library
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: library, path: out }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName) || exit 0
          old=$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p library.json -O - | jq -r .content_hash || echo none)
          new=$(jq -r .content_hash out/library.json)
          if [ "$old" != "$new" ]; then
            gh release upload "$tag" out/regs.sqlite.gz out/library.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
